# Docker compose file used in dev (local env). It removes the volumes and traefik config
name: lab-manager-dev
services:
  # Production Glab
  glab:
    image: constellab/glab:${TAG_PREFIX}${GLAB_TAG}
    environment:
      - LAB_ID=${LAB_ID}
      - LAB_NAME=${LAB_NAME}
      - LAB_MODE=${LAB_MODE}
      - LAB_ENVIRONMENT=${LAB_ENVIRONMENT}
      - LAB_FOLDER=/lab
      - DATA_FOLDER=/data
      - LAB_PROD_API_URL=http://localhost:3100
      - LAB_DEV_API_URL=http://codelab:3000
      - LAB_MANAGER_API_URL=http://lab_manager:3080
      - SPACE_API_KEY=${SPACE_PROD_API_KEY}
      - SPACE_API_URL=${SPACE_API_URL}
      - SPACE_FRONT_URL=${SPACE_FRONT_URL}
      - FRONT_URL=http://localhost:89
      - FRONT_VERSION=${FRONT_VERSION}
      - GPU=${GPU}
      - VIRTUAL_HOST=
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # COMMUNITY
      - COMMUNITY_API_URL=${COMMUNITY_API_URL}
      - COMMUNITY_FRONT_URL=${COMMUNITY_FRONT_URL}
      # GWS_CORE database
      - GWS_CORE_DB_HOST=gws_core_prod_db
      - GWS_CORE_DB_USER=gws_core
      - GWS_CORE_DB_PASSWORD=${GWS_CORE_PROD_DB_PASSWORD}
      - GWS_CORE_DB_NAME=gws_core
      - GWS_CORE_DB_PORT=3306
      - APP_EXTERNAL_PORT=8511
      - APP_SUB_DOMAIN=app
    depends_on:
      - gws_core_prod_db
    volumes:
      # this volume include conf and settings
      - lab-manager-config:/conf
      # volume for prod lab
      - lab-manager-prod-lab:/lab
      - lab-manager-prod-data:/data
    networks:
      - gencovery-network-prod
      # also set it in the dev environment to allow codelab to access it with http://glab:3000
      - gencovery-network-dev
    container_name: glab
    ports:
      - 3100:3000
      # Open app port
      - 8511:8511
    #GPU_CONFIG#

    # Codelab
  codelab:
    image: constellab/codelab:${TAG_PREFIX}${GLAB_TAG}
    environment:
      # The environment variables are also define in gpm repository
      # in codelab-init-ssh.sh file.
      # When a new variable is added or a variable is deleted,
      # the file codelab-init-ssh.sh should be updated too.
      - LAB_ID=${LAB_ID}
      - LAB_NAME=${LAB_NAME}
      - LAB_MODE=dev
      - LAB_ENVIRONMENT=${LAB_ENVIRONMENT}
      - LAB_FOLDER=/lab
      - DATA_FOLDER=/data
      - LAB_PROD_API_URL=http://glab:3000
      - LAB_DEV_API_URL=http://localhost:3101
      - LAB_MANAGER_API_URL=http://lab_manager:3080
      - SPACE_API_KEY=${SPACE_DEV_API_KEY}
      - SPACE_API_URL=${SPACE_API_URL}
      - SPACE_FRONT_URL=${SPACE_FRONT_URL}
      - FRONT_URL=http://localhost:89
      - FRONT_VERSION=${FRONT_VERSION}
      - GPU=${GPU}
      - VIRTUAL_HOST=
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # COMMUNITY
      - COMMUNITY_API_URL=${COMMUNITY_API_URL}
      - COMMUNITY_FRONT_URL=${COMMUNITY_FRONT_URL}
      # GWS_CORE database
      - GWS_CORE_DB_HOST=gws_core_dev_db
      - GWS_CORE_DB_USER=gws_core
      - GWS_CORE_DB_PASSWORD=${GWS_CORE_DEV_DB_PASSWORD}
      - GWS_CORE_DB_NAME=gws_core
      - GWS_CORE_DB_PORT=3306
      # Test database
      - GWS_TEST_DB_HOST=test_gws_dev_db
      - GWS_TEST_DB_USER=root
      - GWS_TEST_DB_PASSWORD=gencovery
      - GWS_TEST_DB_NAME=test_gws
      - GWS_TEST_DB_PORT=3306
      - APP_EXTERNAL_PORT=8512
      - APP_SUB_DOMAIN=app-dev
    volumes:
      - lab-manager-config:/conf
      - lab-manager-dev-lab:/lab
      - lab-manager-dev-data:/data
      # store SSH keys and vscode config persistent (same as prod but with a single volume for /home/labuser)
      - lab-manager-dev-codelab-home:/home/labuser
    depends_on:
      - gws_core_dev_db
    networks:
      - gencovery-network-dev
    container_name: codelab
    ports:
      - 8083:8080
      - 3101:3000
      # Open app port
      - 8512:8512
    #GPU_CONFIG#

    # Front
  front:
    image: constellab/lab-front:latest
    environment:
      - API_URL=http://localhost:3100
      - LAB_PROD_API_URL=http://localhost:3100
      - LAB_DEV_API_URL=http://localhost:3101
      - CODELAB_URL=http://localhost:8083
      - VIRTUAL_HOST=
      - SPACE_FRONT_URL=${SPACE_FRONT_URL}
      - SPACE_API_URL=${SPACE_API_URL}
      # same dev and prod url
      - PROD_FRONT_URLS=http://localhost:89
      - DEV_FRONT_URLS=http://localhost:89
      - COMMUNITY_FRONT_URL=${COMMUNITY_FRONT_URL}
      - COMMUNITY_API_URL=${COMMUNITY_API_URL}
      - CSP_ALLOWED_DOMAINS=${CSP_ALLOWED_DOMAINS}
      - COMMUNITY_CSP_ALLOWED_DOMAIN=${COMMUNITY_CSP_ALLOWED_DOMAIN}
      - CAPTCHA_SITE_KEY=
    networks:
      - gencovery-network-prod
    container_name: front
    ports:
      - 89:81

  # GWS Core Production DB
  gws_core_prod_db:
    image: mariadb:10.7.4
    command: --max_allowed_packet=256M
    environment:
      - MYSQL_ROOT_PASSWORD=${GWS_CORE_PROD_DB_PASSWORD}
      - MYSQL_USER=gws_core
      - MYSQL_PASSWORD=${GWS_CORE_PROD_DB_PASSWORD}
      - MYSQL_DATABASE=gws_core
    volumes:
      - lab-manager-prod-db:/var/lib/mysql
    networks:
      - gencovery-network-prod
    container_name: gws_core_prod_db
    ports:
      - 3406:3306

  # GWS Core Development DB
  gws_core_dev_db:
    image: mariadb:10.7.4
    command: --max_allowed_packet=256M
    environment:
      - MYSQL_ROOT_PASSWORD=${GWS_CORE_DEV_DB_PASSWORD}
      - MYSQL_USER=gws_core
      - MYSQL_PASSWORD=${GWS_CORE_DEV_DB_PASSWORD}
      - MYSQL_DATABASE=gws_core
    volumes:
      - lab-manager-dev-db:/var/lib/mysql
    networks:
      - gencovery-network-dev
    container_name: gws_core_dev_db
    ports:
      - 3407:3306

  # GWS Test db
  test_gws_dev_db:
    image: mariadb:10.7.4
    # Only root credentials are needed — test databases and users are
    # created on the fly by the test suite.
    environment:
      - MYSQL_ROOT_PASSWORD=gencovery
    networks:
      - gencovery-network-dev
    container_name: test_gws_dev_db
    ports:
      - 3408:3306
    # is ephemeral — data is discarded when the container stops, and I/O is
    # much faster since nothing hits disk.
    tmpfs:
      - /var/lib/mysql:rw,size=2g
    # MariaDB tuning flags to maximize write speed at the cost of durability,
    # which is fine for a test database that is thrown away after each run.
    command:
      - --max_allowed_packet=256M
      - --innodb-flush-log-at-trx-commit=0 # don't flush redo log on every commit
      - --innodb-doublewrite=0 # skip the doublewrite buffer
      - --sync-binlog=0 # don't fsync the binlog on each write
      - --skip-log-bin # disable binary logging entirely
      - --innodb-flush-method=nosync # skip fsync/fdatasync calls
      - --innodb-buffer-pool-size=512M # generous buffer pool for in-memory work
      - --max-connections=200 # allow enough connections for parallel tests

networks:
  gencovery-network-dev:
    external: true
  gencovery-network-prod:
    external: true

# the volume names are the same as the one in the lab-configurer local docker-compose.yml
# this is because volume are relative to host machine and not docker image
volumes:
  lab-manager-config:
    external: true
  lab-manager-prod-db:
    external: true
  lab-manager-dev-db:
    external: true
  lab-manager-prod-lab:
    external: true
  lab-manager-prod-data:
    external: true
  lab-manager-dev-lab:
    external: true
  lab-manager-dev-data:
    external: true
  lab-manager-dev-codelab-home:
    external: true
