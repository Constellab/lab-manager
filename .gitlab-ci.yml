image: docker:latest
services:
  - docker:dind

variables:
  DOCKER_DRIVER: overlay2
  GIT_DEPTH: 0
  LAB_MANAGER_IMAGE: lab-manager


stages:
  - build-app

# Build and push image to public registry
build-app:
  stage: build-app
  before_script:
    # Push image in the registry
    - docker login -u $DOCKER_PUBLIC_USERNAME -p $DOCKER_PUBLIC_PASSWORD $DOCKER_PUBLIC_REGISTRY
  script:
    - echo $DOCKER_PUBLIC_REGISTRY
    - echo $DOCKER_PUBLIC_USERNAME
    - echo $DOCKER_PUBLIC_PASSWORD
    # Read the commit tag
    - export VERSION=$CI_COMMIT_TAG
    # Build the docker image from Dockerfile with the tag of the git tag
    - docker build --build-arg LAB_MANAGER_VERSION=$CI_COMMIT_TAG --tag $DOCKER_PUBLIC_REGISTRY/$LAB_MANAGER_IMAGE:$VERSION . -f Dockerfile
    - docker push $DOCKER_PUBLIC_REGISTRY/$LAB_MANAGER_IMAGE:$VERSION
  only:
    - tags


