image: docker:latest
services:
  - docker:dind

variables:
  DOCKER_DRIVER: overlay
  GIT_DEPTH: 0
  LAB_MANAGER_IMAGE: lab-manager


stages:
  - build-app
  - deploy-app

# Build nest and create an artifact with dist folder
build-app:
  image: node:14-alpine
  stage: build-app
  script:
    - npm ci
    - npm run build
  artifacts:
    expire_in: 1 day
    paths:
      - dist/
      - package.json
      - package-lock.json
  only:
    - master

# Push lab-front image to the docker registry using Dockerfile of the lab-front
deploy-app:
  stage: deploy-app
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build the docker image from Dockerfile with a latest tag and a tag for the commit
    - docker build --cache-from $CI_REGISTRY_IMAGE/$LAB_MANAGER_IMAGE:latest --tag $CI_REGISTRY_IMAGE/$LAB_MANAGER_IMAGE:$CI_COMMIT_SHA --tag $CI_REGISTRY_IMAGE/$LAB_MANAGER_IMAGE:latest . -f Dockerfile
    # Push both image in the registry
    - docker push $CI_REGISTRY_IMAGE/$LAB_MANAGER_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/$LAB_MANAGER_IMAGE:latest
  only:
    - master


